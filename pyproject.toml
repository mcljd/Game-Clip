[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hclip"
version = "0.2.0"
description = "Cut GAA match clips from a coach's list of timings"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Joseph McLaughlin" }]
dependencies = []

[project.optional-dependencies]
app = ["pywebview>=5.4"]
dev = ["pytest>=8"]

[project.scripts]
hclip = "hclip.cli:main"

[project.gui-scripts]
gaa-clips = "hclip.app.main:main"

[tool.setuptools]
packages = ["hclip", "hclip.app"]

[tool.setuptools.package-data]
"hclip.app" = ["ui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs real ffmpeg/ffprobe"]
