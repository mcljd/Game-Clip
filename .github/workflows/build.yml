name: Test and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # attach the installer to releases on v* tags

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e ".[dev]"
      - run: pytest -q

  web:
    name: web (iPhone/browser version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Parser tests (shared cases with the Python parser)
        run: node --test tests/web/*.test.js
      - run: web/fetch-vendor.sh
      - run: pip install -e ".[dev]" playwright
      - run: python -m playwright install --with-deps chromium
      - name: End-to-end in headless Chromium (real ffmpeg.wasm)
        run: pytest -q tests/test_web_e2e.py -rs

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download ffmpeg (GPL build, includes libx264 for exact cuts)
        run: |
          $ErrorActionPreference = "Stop"
          $urls = @(
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip",
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          )
          $ok = $false
          foreach ($u in $urls) {
            try {
              Write-Host "Trying $u"
              Invoke-WebRequest -Uri $u -OutFile ffmpeg.zip -MaximumRetryCount 3 -RetryIntervalSec 5
              $ok = $true; break
            } catch { Write-Warning "Failed: $_" }
          }
          if (-not $ok) { throw "Could not download ffmpeg" }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_x
          New-Item -ItemType Directory -Force vendor/ffmpeg | Out-Null
          $bin = (Get-ChildItem ffmpeg_x -Recurse -Filter ffmpeg.exe | Select-Object -First 1).Directory
          Copy-Item "$bin/ffmpeg.exe", "$bin/ffprobe.exe" vendor/ffmpeg/
          $lic = Get-ChildItem ffmpeg_x -Recurse -Include LICENSE*, COPYING* | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName vendor/ffmpeg/LICENSE.txt }
          else { "FFmpeg is licensed under the GPL. Source: https://ffmpeg.org/download.html" | Out-File vendor/ffmpeg/LICENSE.txt }
          "$PWD\vendor\ffmpeg" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & vendor/ffmpeg/ffmpeg.exe -version | Select-Object -First 1

      - run: pip install -e ".[dev,app]" pyinstaller

      - name: Tests on Windows (real ffmpeg, Windows paths)
        run: pytest -q

      - name: Build app
        run: pyinstaller --noconfirm packaging/gaa-clips.spec

      - name: Self-test the packaged app
        run: |
          $exe = "dist/GAA Clips/GAA Clips.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest", "$PWD\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "selftest failed ($($p.ExitCode))" }
          $v = (Get-Item $exe).VersionInfo
          "Company: $($v.CompanyName) | Product: $($v.ProductName) $($v.ProductVersion) | $($v.LegalCopyright)"
          if ($v.CompanyName -ne "Joseph McLaughlin") { throw "exe author details missing" }

      - name: Build installer
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          }
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          iscc /DAppVersion=$version packaging/installer.iss
          Compress-Archive -Path "dist/GAA Clips" -DestinationPath "dist/GAA-Clips-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: GAA-Clips-Windows
          path: |
            dist/GAA-Clips-Setup.exe
            dist/GAA-Clips-portable.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GAA-Clips-Setup.exe
            dist/GAA-Clips-portable.zip
